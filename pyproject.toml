[project]
name = "customerservice-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-cli[inmem]>=0.4.31",
    "psycopg[binary]>=3.3.5",
    "uvicorn>=0.52.4",
]

[project.scripts]
customerservice-agent = "customerservice_agent:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
